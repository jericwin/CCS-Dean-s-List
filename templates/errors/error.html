{% extends "base.html" %}
{% import "partials/macros.html" as ui with context %}
{% block title %}{{ title }}{% endblock %}
{% block body %}
<main class="error-page" id="main">
  <div>
    {{ ui.fox_art() }}
    <div class="code">{{ code }}</div>
    <h1>{{ title }}</h1>
    <p>{{ message }}</p>
    <div class="row">
      {% if current_role %}
      <a class="btn btn-primary" href="{{ url_for('public.dashboard') }}"><i class="fas fa-house"></i>Back to my portal</a>
      {% else %}
      <a class="btn btn-primary" href="{{ url_for('public.index') }}"><i class="fas fa-house"></i>Go home</a>
      <a class="btn" style="--btn-bg:transparent;--btn-fg:#fff;--btn-border:rgba(255,255,255,.3)" href="{{ url_for('public.login') }}">Sign in</a>
      {% endif %}
    </div>
  </div>
</main>
{% endblock %}
