<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <meta name="theme-color" content="#561019">
  <title>{% block title %}CCS Dean's List{% endblock %} · CCS SBO</title>
  <link rel="icon" href="{{ url_for('static', filename='logo.png') }}" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/fox.css') }}">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}" data-role="{{ current_role or '' }}">
  <a class="skip-link" href="#main">Skip to content</a>
  {% block body %}{% endblock %}

  <div class="toast-stack" id="toasts" aria-live="polite"></div>

  <div class="modal" id="confirmModal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <div class="modal-dialog" style="width:min(440px,100%)">
      <div class="modal-head">
        <div><h2 id="confirmTitle" data-confirm-title>Are you sure?</h2><p data-confirm-message></p></div>
        <button class="btn btn-ghost btn-icon btn-sm" data-modal-close aria-label="Close"><i class="fas fa-xmark"></i></button>
      </div>
      <div class="modal-foot">
        <button class="btn" type="button" data-modal-close>Cancel</button>
        <button class="btn btn-danger" type="button" data-confirm-ok>Confirm</button>
      </div>
    </div>
  </div>

  {% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}<script type="application/json" id="flash-data">{{ messages|tojson }}</script>{% endif %}
  {% endwith %}
  {% block vendor_scripts %}{% endblock %}
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
